<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050805">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Conqueror Drive</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
/* Basic Drive v2 = Cockpit-lite (hub-ux.md Screen 7b, bridge LLD R3): the phone Cockpit (stitch/07-cockpit-phone-v1)
   over full-screen video. Phosphor theme: green UI on near-black, status colours never green, glow only on chrome. */
:root {
  --bg: #050805; --glass: rgba(6, 14, 8, .72); --edge-c: rgba(51, 255, 102, .38); --ui: #33ff66; --dim: #1f9a40;
  --warn: #ffb000; --danger: #ff3b30; --active: #e8ffe8; --text: #b8f5c8;
  --glow: 0 0 8px rgba(51, 255, 102, .35);
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
  --edge: max(10px, env(safe-area-inset-left)); --redge: max(10px, env(safe-area-inset-right));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.25 var(--mono); }
body { overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
button, input, a { font: inherit; color: inherit; }
svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -2px; }
#video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.novideo { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); letter-spacing: .1em; }
.ov { position: fixed; z-index: 2; }
.glass { background: var(--glass); border: 1px solid var(--edge-c); border-radius: 7px; box-shadow: var(--glow); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.chips { top: 10px; left: var(--edge); display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(50vw - 95px); }
.chip { padding: 5px 8px; white-space: nowrap; color: var(--ui); }
.chip small { color: var(--dim); margin-right: 3px; letter-spacing: .05em; }
.chip b { font-weight: 700; }
#ownerChip { background: var(--ui); color: #032; border-radius: 4px; padding: 1px 5px; }
#ownerChip.warn { background: var(--warn); color: #221500 !important; }  /* beats the global .warn text colour */
#audioChip { cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
#audioChip.muted { color: var(--warn); border-color: var(--warn); box-shadow: none; }
.ok { color: var(--ui); } .warn { color: var(--warn) !important; } .bad { color: var(--danger) !important; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-right: 6px; vertical-align: 1px; }
.dot.on { background: var(--ui); box-shadow: 0 0 6px var(--ui); } .dot.wait { background: var(--warn); }
.hdg { top: 10px; left: 50%; transform: translateX(-50%); padding: 5px 14px; border-radius: 16px; white-space: nowrap; color: var(--ui); display: flex; gap: 12px; align-items: baseline; }
.hdg .side { color: var(--dim); font-size: 11px; }
.hdg .main { color: var(--active); font-size: 15px; font-weight: 700; text-shadow: var(--glow); }
.hdg .card { color: var(--ui); font-weight: 700; }
#stop { top: 10px; right: var(--redge); background: var(--danger); color: #fff; border: 1px solid #ff6a60; border-radius: 7px;
  font-size: 16px; font-weight: 800; letter-spacing: .12em; padding: 10px 18px; box-shadow: 0 0 14px rgba(255, 59, 48, .55);
  display: flex; gap: 8px; align-items: center; }
#stop svg { width: 18px; height: 18px; }
#stop:active { transform: scale(.97); filter: brightness(1.2); }
.dist { right: var(--redge); top: 70px; bottom: 160px; display: flex; gap: 6px; align-items: stretch; }
.range { align-self: center; padding: 5px 7px; text-align: center; }
.range small { display: block; color: var(--dim); font-size: 9px; letter-spacing: .1em; }
.range b { color: var(--ui); font-size: 13px; }
.distbar { width: 9px; border-radius: 5px; border: 1px solid var(--edge-c); position: relative; overflow: hidden;
  background: linear-gradient(to top, #33ff66 0%, #33ff66 45%, #ffb000 72%, #ff3b30 100%); }
.batt { left: var(--edge); top: 70px; bottom: 160px; display: flex; gap: 6px; align-items: stretch; }
/* Battery scale as the range scale: red at the bottom (critical 6.6 V = 0 %), amber at low (7.2 V = 20 %), green above. */
.battbar { width: 9px; border-radius: 5px; border: 1px solid var(--edge-c); position: relative; overflow: hidden;
  background: linear-gradient(to top, #ff3b30 0%, #ff3b30 8%, #ffb000 20%, #33ff66 35%, #33ff66 100%); }
.battbar.usb { background: #7a857c; }
#battMask { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: rgba(5, 10, 6, .9); }
.range i { display: block; font-style: normal; color: var(--dim); font-size: 10px; }
#distMask { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: rgba(5, 10, 6, .9); }
.stick { display: flex; flex-direction: column; gap: 5px; align-items: center; }
.stick .ttl { color: var(--ui); font-size: 10px; letter-spacing: .12em; text-shadow: var(--glow); }
.pad { position: relative; width: min(31vh, 21vw, 170px); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(51, 255, 102, .55);
  background: radial-gradient(circle, rgba(6, 18, 9, .55) 55%, rgba(6, 18, 9, .8)); box-shadow: 0 0 16px rgba(51, 255, 102, .28), inset 0 0 22px rgba(51, 255, 102, .12); touch-action: none; }
.pad::before, .pad::after { content: ""; position: absolute; background: rgba(51, 255, 102, .2); }
.pad::before { left: 50%; top: 10%; bottom: 10%; width: 1px; } .pad::after { top: 50%; left: 10%; right: 10%; height: 1px; }
.pad.small { width: min(29vh, 19vw, 150px); }
.knob { position: absolute; left: 50%; top: 50%; width: 34%; height: 34%; margin: -17% 0 0 -17%; border-radius: 50%; z-index: 1;
  background: radial-gradient(circle at 45% 40%, #1d7a35, #0b3d18 70%); border: 2px solid #33ff66;
  box-shadow: 0 0 18px rgba(51, 255, 102, .7), inset 0 0 10px rgba(51, 255, 102, .35);
  display: flex; align-items: center; justify-content: center; color: #b8ffc9; }
.knob svg { width: 45%; height: 45%; stroke-width: 2.5; }
.pad.held .knob { background: radial-gradient(circle at 45% 40%, #33ff66, #14a83d 70%); color: #032; }
.pad.off { opacity: .35; }
/* Camera position (R3.2): ghost dot = where the camera points; ring edge = 90° from home. */
.ghost { position: absolute; left: 50%; top: 50%; width: 12%; height: 12%; margin: -6% 0 0 -6%; border-radius: 50%; z-index: 2;
  pointer-events: none; background: rgba(184, 255, 201, .75); box-shadow: 0 0 8px rgba(51, 255, 102, .8); transition: left .1s linear, top .1s linear; }
.pad.held .ghost { opacity: .35; }
.pad.ind .knob { display: none; }
.pad.ind .ghost { width: 16%; height: 16%; margin: -8% 0 0 -8%; background: #d9ffe3; box-shadow: 0 0 14px #33ff66, 0 0 4px #fff; }
/* Titles float above the rings: their length (owner name, angles) never moves the layout. */
.stick { position: relative; padding-top: 16px; }
.stick .ttl { position: absolute; top: 0; left: 0; white-space: nowrap; }
.right .stick .ttl { left: auto; right: 0; }
.stick .ttl i { font-style: normal; color: var(--active); margin-left: 4px; }
.lbl { position: absolute; font-size: 7px; color: var(--dim); letter-spacing: .05em; }
.lbl.n { top: 5%; left: 50%; transform: translateX(-50%); } .lbl.s { bottom: 5%; left: 50%; transform: translateX(-50%); }
.lbl.w { left: 3%; top: 50%; transform: translateY(-50%); } .lbl.e { right: 3%; top: 50%; transform: translateY(-50%); }
.left { left: var(--edge); bottom: 10px; display: flex; align-items: flex-end; gap: 10px; }
.right { right: 34px; bottom: 10px; display: flex; align-items: flex-end; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
.btn { padding: 6px 10px; color: var(--ui); text-decoration: none; text-align: center; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
.btn.on { background: var(--ui); color: #032; }
.tiltcard { flex-direction: column; gap: 3px; padding: 8px 10px; margin-bottom: 8px; font-size: 10px; letter-spacing: .08em; }
.tiltcard svg { width: 18px; height: 18px; }
.tiltcard small { color: var(--dim); }
.mid { bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; }
.pills { display: flex; gap: 6px; }
.pill { border-radius: 16px; padding: 5px 12px; font-size: 11px; letter-spacing: .06em; }
.vitals { padding: 5px 14px; border-radius: 16px; color: var(--active); white-space: nowrap; letter-spacing: .03em; }
.vitals i { color: var(--dim); font-style: normal; margin: 0 6px; }
.banner { top: 52px; left: 50%; transform: translateX(-50%); max-width: 66vw; padding: 7px 12px; border-radius: 7px; text-align: center;
  background: rgba(10, 4, 4, .85); display: none; }
.banner.show { display: block; } .banner.warn { border: 1px solid var(--warn); color: var(--warn); } .banner.bad { border: 1px solid var(--danger); color: var(--danger); box-shadow: 0 0 10px rgba(255, 59, 48, .35); }
.sheet { left: 50%; bottom: 82px; transform: translateX(-50%); width: min(470px, 66vw); max-height: 52vh; overflow: auto; padding: 10px; display: none; z-index: 4; background: rgba(6, 14, 8, .94); }
.sheet.show { display: block; }
.sheet .title { color: var(--ui); text-shadow: var(--glow); font-size: 11px; letter-spacing: .1em; margin: 0 0 8px; }
.sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.sgrid .btn { font-size: 11px; }
input[type=range] { width: 100%; accent-color: var(--ui); }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); padding: 7px 12px; border-radius: 7px; z-index: 5;
  background: var(--glass); border: 1px solid var(--warn); color: var(--warn); opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#rotate { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px;
  background: var(--bg); color: var(--ui); text-shadow: var(--glow); letter-spacing: .1em; }
@media (orientation: portrait) { #rotate { display: flex; } }
@media (max-width: 800px) { .pill .lab { display: none; } }  /* narrow phones: icon-only pills, MAX keeps its value */
@media (max-height: 380px) { .pad { width: min(36vh, 19vw, 150px); } .pad.small { width: min(31vh, 16vw, 125px); } .chip { padding: 4px 7px; } }
</style>
</head>
<body>
<img id="video" alt="">
<div id="noVideo" class="novideo">[ NO VIDEO ]</div>

<div class="ov chips">
  <span class="chip glass"><span id="wsDot" class="dot"></span><b id="latChip">--</b></span>
    <span class="chip glass"><small>WIFI</small><b id="wifiChip">-</b></span>
  <span class="chip glass"><small>CTRL:</small><b id="ownerChip">-</b></span>
  <button id="audioChip" class="chip glass" type="button" aria-label="mute or unmute the tank"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="audioWaves" d="M17 9a4 4 0 0 1 0 6M19.5 6.5a7.5 7.5 0 0 1 0 11"/><path id="audioCross" class="hidden" d="M17 9l5 6M22 9l-5 6"/></svg><b id="audioTxt"></b></button>
</div>
<div class="ov hdg glass"><span id="hdgL" class="side">-</span><span id="hdgC" class="main">▼ -</span><span id="hdgCard" class="card">-</span><span id="hdgR" class="side">-</span></div>
<button id="stop" class="ov" type="button"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a8 8 0 0 0 16 0v-3a2 2 0 0 0-4 0"/></svg>STOP</button>
<div class="ov dist"><div class="range glass"><small>RANGE</small><b id="distTxt">-</b></div><div class="distbar"><div id="distMask"></div></div></div>
<div class="ov batt"><div id="battBar" class="battbar"><div id="battMask"></div></div><div class="range glass"><small>BATT</small><b id="battTxt">-</b><i id="battV"></i></div></div>
<div id="banner" class="ov banner"></div>

<div class="ov left">
  <div class="stick"><span class="ttl">⇅ DRIVE // TANK</span>
    <div id="drivePad" class="pad off"><span class="lbl n">FWD</span><span class="lbl s">REV</span><span class="lbl w">L</span><span class="lbl e">R</span>
      <div class="knob"><svg viewBox="0 0 24 24"><path d="M12 3l7 18-7-4-7 4z"/></svg></div></div></div>
  <button id="tiltBtn" class="btn glass tiltcard hidden" type="button"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2" transform="rotate(-20 12 12)"/></svg>TILT STEER<small id="tiltState">[ OFF ]</small></button>
</div>
<div class="ov right">
  <div class="col">
    <button id="camLock" class="btn glass" type="button"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>LOCK</button>
    <button id="camHome" class="btn glass" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></svg>HOME</button>
  </div>
  <div class="stick"><span class="ttl">▣ GIMBAL // <span id="camWho">CAM</span><i id="camAng"></i></span>
    <div id="camPad" class="pad small off"><span class="lbl n">UP</span><span class="lbl s">DOWN</span><span class="lbl w">PAN L</span><span class="lbl e">PAN R</span><div id="camDot" class="ghost"></div>
      <div class="knob"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v6M12 10V4a1.5 1.5 0 0 1 3 0v7M15 11V7a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-12 5l-2-3a1.5 1.5 0 0 1 2.5-1.5L9 15"/></svg></div></div></div>
</div>

<div class="ov mid">
  <div class="pills">
    <a id="snap" class="btn glass pill" download><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="lab">SNAP</span></a>
    <button id="soundsBtn" class="btn glass pill hidden" type="button"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6M19.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span class="lab">SOUNDS</span></button>
    <button id="movesBtn" class="btn glass pill hidden" type="button"><svg viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M10 9l4-2 3 4 3 1M10 9l-2 5H4"/></svg><span class="lab">MOVES</span></button>
    <button id="moreBtn" class="btn glass pill" type="button"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>MAX <b id="maxTxt">60%</b></button>
  </div>
  <div id="vitals" class="vitals glass">-</div>
</div>

<div id="soundSheet" class="ov sheet glass"><p class="title">[ SOUNDS ]</p><div id="soundGrid" class="sgrid"></div></div>
<div id="movesSheet" class="ov sheet glass"><p class="title">[ MOVES ]</p><div>Turn by angle and move by distance come with the hub (Tank Logo / AI).</div></div>
<div id="moreSheet" class="ov sheet glass">
  <p class="title">[ SPEED ] <b id="speedTxt">60%</b></p>
  <input id="speed" type="range" min="10" max="100" step="5" value="60" aria-label="speed">
</div>
<div id="toast"></div>
<div id="rotate">[ ROTATE THE PHONE ]<br>landscape only</div>
<script>
"use strict";
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DRIVE_MS = 50;        // drive is re-sent every 50 ms while held: the bridge never repeats it
  var DEADZONE = 0.05, EXPO = 0.3;
  var SOUNDS = ["startup", "ready", "selftest_fail", "chirp_up", "chirp_down", "blip", "tick", "jingle", "thinking", "ouch",
    "error", "success", "fanfare", "sad", "safety_chirp", "ack_blip", "fail", "confirm", "question", "ok_chirp", "grumble",
    "scan", "goodbye"];  // proto::SoundId order (spec 02 §A9 catalogue)
  var ws = null, wsOpen = false, you = "", synced = false, owner = "none", ownerClient = "";
  var nextId = 1, retryMs = 1000, pingTimer = 0, camLocked = false;
  var speed = 60;
  try { speed = Number(localStorage.getItem("cq_speed")) || 60; } catch (e) { /* private mode */ }
  $("speed").value = speed;
  $("speedTxt").textContent = speed + "%";
  $("maxTxt").textContent = speed + "%";

  // ---------- WebSocket ----------
  function send(obj) {
    if (ws && wsOpen) { ws.send(JSON.stringify(obj)); return true; }
    return false;
  }
  function connect() {
    setWs("wait", "...");
    ws = new WebSocket("ws://" + location.host + "/ws");
    ws.onopen = function () {
      wsOpen = true; retryMs = 1000;
      setWs("on", "--");
      send({ t: "hello", client: "basic-drive", proto: 1 });
      clearInterval(pingTimer);
      pingTimer = setInterval(function () { send({ t: "ping", t0: Date.now() }); }, 1000);
      setPads();
    };
    ws.onmessage = function (ev) {
      var m;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      onMessage(m);
    };
    ws.onclose = function () {
      wsOpen = false; synced = false;
      clearInterval(pingTimer);
      releaseAll(false);
      setWs("", "OFF");
      setPads();
      setTimeout(connect, retryMs);
      retryMs = Math.min(retryMs * 2, 5000);
    };
    ws.onerror = function () { ws.close(); };
  }
  function setWs(cls, txt) {
    $("wsDot").className = "dot " + cls;
    $("latChip").textContent = txt;
  }

  function onMessage(m) {
    switch (m.t) {
      case "welcome":
        you = m.you || "";
        showCaps(m.tank && m.tank.caps ? m.tank.caps : {});
        showOwner(m.owner, m.owner_client);
        break;
      case "tf": showFast(m); break;
      case "ts": showSlow(m); break;
      case "ev": onEvent(m); break;
      case "nack": onNack(m); break;
      case "pong": showLatency(m); break;
      case "ack":  // chip follows at once; ts (1 Hz, may still be older) is ignored for 2.5 s
        if (m.id === audioAsk.id) { showAudio(audioAsk.mode); audioHoldUntil = Date.now() + 2500; }
        break;
      default: break;  // ack
    }
  }
  // Features the tank's firmware lacks are hidden (HELLO CapBits): MOVES needs turn/move, SOUNDS needs audio_led.
  function showCaps(c) {
    $("soundsBtn").classList.toggle("hidden", !c.audio_led);
    $("movesBtn").classList.toggle("hidden", !(c.turn || c.move));
  }
  function showLatency(m) {
    if (typeof m.t0 !== "number") return;
    var ms = Math.round(latMean.push(Math.max(0, Date.now() - m.t0)));
    $("latChip").textContent = ms + "ms";
    $("latChip").className = ms > 250 ? "bad" : ms > 120 ? "warn" : "";
  }

  // ---------- display filters (R3.3): what is SHOWN only; the tank's safety logic uses raw values ----------
  // FILTERS-BEGIN
  function MeanN(n) {  // mean of the last n values
    var buf = [];
    this.push = function (v) { buf.push(v); if (buf.length > n) buf.shift(); var s = 0; for (var i = 0; i < buf.length; i++) s += buf[i]; return s / buf.length; };
    this.reset = function () { buf = []; };
  }
  function Ema(alpha) {  // exponential average; first value taken as is
    var v = null;
    this.push = function (x) { v = v === null ? x : v + alpha * (x - v); return v; };
    this.reset = function () { v = null; };
  }
  var RANGE_CLEAR = 999;  // "no echo" (dist_cm null) counts as far away
  function RangeView() {  // median of 5 kills one-off echoes; closer shows at once, farther eases in
    var buf = [], shown = null;
    this.push = function (cm) {
      buf.push(cm === null ? RANGE_CLEAR : cm);
      if (buf.length > 5) buf.shift();
      var med = buf.slice().sort(function (a, b) { return a - b; })[buf.length >> 1];
      shown = shown === null || med < shown ? med : shown + 0.3 * (med - shown);
      return shown >= 400 ? null : Math.round(shown);  // null = CLEAR
    };
  }
  function turnRate(ema, raw) {  // median of 3 (one-off spikes), 0.3 s average, |x| < 2 °/s shown as 0
    if (typeof raw !== "number") return null;
    var b = ema.last3 = (ema.last3 || []).concat([raw]).slice(-3);
    var v = ema.push(b.slice().sort(function (x, y) { return x - y; })[b.length >> 1]);
    return Math.abs(v) < 2 ? 0 : Math.round(v);
  }
  // FILTERS-END
  var rangeView = new RangeView(), rateEma = new Ema(0.3), battMean = new MeanN(10), latMean = new MeanN(5);
  var battWasUsb = null, vitalsAt = 0;

  // ---------- telemetry ----------
  var BATT_CURVE = [[8.4, 100], [8.2, 90], [8.0, 80], [7.8, 65], [7.6, 50], [7.4, 35], [7.2, 20], [7.0, 10], [6.8, 5], [6.6, 0]];
  function battPct(v) {  // 2S Li-ion, resting voltage
    if (v >= BATT_CURVE[0][0]) return 100;
    for (var i = 1; i < BATT_CURVE.length; i++) {
      var hi = BATT_CURVE[i - 1], lo = BATT_CURVE[i];
      if (v >= lo[0]) return Math.round(lo[1] + (v - lo[0]) * (hi[1] - lo[1]) / (hi[0] - lo[0]));
    }
    return 0;
  }
  var vit = { spd: "SPEED -", rate: "TURN -" };
  function showVitals() {
    var now = Date.now();
    if (now - vitalsAt < 250) return;  // text 4x/s: no digit flicker
    vitalsAt = now;
    $("vitals").innerHTML = vit.spd + "<i>·</i>" + vit.rate;
  }
  var CARD = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
  function norm(a) { return ((Math.round(a) % 360) + 360) % 360; }
  function drawTape(head) {  // heading pill as the Cockpit: 170°  ▼184°  S  200°
    $("hdgL").textContent = norm(head - 15) + "°";
    $("hdgC").textContent = "▼" + norm(head) + "°";
    $("hdgCard").textContent = CARD[Math.round(norm(head) / 45) % 8];
    $("hdgR").textContent = norm(head + 15) + "°";
  }
  function showFast(m) {
    drawTape(m.yaw);
    var rate = turnRate(rateEma, m.yaw_rate);
    vit.rate = "TURN " + (rate === null ? "-" : (rate > 0 ? "+" : "") + rate + "°/s");
    showCam(m.pan, m.tilt);
    vit.spd = "SPEED " + Math.max(Math.abs(m.spd_cmd[0]), Math.abs(m.spd_cmd[1])) + "%";
    showVitals();
    var d = rangeView.push(m.dist_cm);
    $("distTxt").textContent = d === null ? "CLEAR" : d + "cm";
    var pct = d === null ? 0 : Math.max(4, 100 - Math.min(d, 200) / 2);  // fuller = closer (0–2 m); colour from the scale
    $("distMask").style.height = (100 - pct) + "%";
    $("distTxt").className = d !== null && d < 15 ? "bad" : d !== null && d < 50 ? "warn" : "ok";
  }
  function showSlow(m) {
    if (m.batt_v !== null) {
      var usb = m.batt_v < 5.5;
      if (usb !== battWasUsb) { battMean.reset(); battWasUsb = usb; }  // USB <-> pack: start the average again
      var v = battMean.push(m.batt_v);
      var pct = battPct(v);
      var cls = m.flags.indexOf("batt_critical") >= 0 ? "bad" : m.flags.indexOf("batt_low") >= 0 ? "warn" : "";
      // Below 5.5 V there is no pack: USB back-feed (same rule as the body firmware, spec 02 §D6.3).
      $("battTxt").textContent = usb ? "USB" : pct + "%";
      $("battTxt").className = usb ? "" : cls || "ok";
      $("battV").textContent = v.toFixed(2) + " V";
      $("battMask").style.height = (usb ? 0 : 100 - Math.max(3, pct)) + "%";  // empty part masked, colour from the scale
      $("battBar").className = usb ? "battbar usb" : "battbar";
    }
    if (Date.now() >= audioHoldUntil) showAudio(m.flags.indexOf("muted") >= 0 ? "mute" : m.flags.indexOf("quiet") >= 0 ? "quiet" : "normal");
    var offline = m.flags.indexOf("body_offline") >= 0;
    synced = !offline;
    showOwner(m.owner, m.owner_client);
    if (offline) banner("bad", "Tank body offline - check the Uno and the S1 switch");
    // The Uno hears nothing from the ESP32 although its telemetry arrives: S1 is in the upload position.
    else if (m.flags.indexOf("link_lost") >= 0) banner("bad", "Uno can't hear the ESP32 - check switch S1");
    else if (bannerKind === "bad") banner("", "");
    setPads();
  }
  // Camera position in the ring (R3.2): home = pan 90 / tilt 90; stick right = smaller pan, up = smaller tilt (§45).
  function showCam(pan, tilt) {
    if (typeof pan !== "number" || typeof tilt !== "number") return;
    var x = Math.max(-1, Math.min(1, (90 - pan) / 90)), y = Math.max(-1, Math.min(1, (90 - tilt) / 90));
    $("camDot").style.left = (50 + x * 45) + "%";
    $("camDot").style.top = (50 - y * 45) + "%";
    var p = Math.round(90 - pan), t = Math.round(90 - tilt);
    $("camAng").textContent = (p > 0 ? "→" + p : p < 0 ? "←" + -p : "0") + "° " + (t > 0 ? "↑" + t : t < 0 ? "↓" + -t : "0") + "°";
  }
  function showOwner(o, client) {
    owner = o || "none"; ownerClient = client || "";
    var txt = owner === "none" ? "FREE" : owner === "ir" ? "IR" : (ownerClient === you ? "YOU" : ownerClient.toUpperCase() || "HUMAN");
    $("ownerChip").textContent = txt;
    var busy = owner !== "none" && !(owner === "human" && ownerClient === you);  // someone else steers
    $("camPad").classList.toggle("ind", busy);  // ring becomes a camera indicator (R3.2)
    if (busy && cam.held) cam.release(false);  // not ours any more: the owner's commands rule
    $("camWho").textContent = !busy ? "CAM" : owner === "human" ? (ownerClient.toUpperCase() || "HUMAN") : owner.toUpperCase();
    $("ownerChip").className = busy ? "warn" : "";
    if (!busy && bannerKind === "warn") banner("", "");
  }
  function onEvent(m) {
    if (m.kind === "control_changed") showOwner(m.owner, m.client);
    else if (m.kind === "deadman_stop") toast("Stopped: no drive signal (deadman)");
    else if (m.kind === "blocked") toast("Obstacle brake: " + m.dist_cm + " cm");
    else if (m.kind === "ir_override") toast("IR remote took control");
    else if (m.kind === "batt_critical") toast("Battery critical " + m.v.toFixed(2) + " V");
    else if (m.kind === "body_offline" && m.reason === "BODY_INCOMPATIBLE")
      banner("bad", "Uno protocol " + m.uno_proto + " - flash a matching body firmware (needs " + m.need_proto + ")");
  }
  // Speaker chip (R3.1): the tank's audio state; tap toggles mute <-> normal (quiet stays IR / hub).
  var audio = "normal", lastSoundId = -1, audioAsk = { id: -1, mode: "" }, audioHoldUntil = 0;
  function showAudio(mode) {
    audio = mode;
    $("audioChip").className = "chip glass" + (mode === "normal" ? "" : " muted");
    $("audioWaves").classList.toggle("hidden", mode === "mute");
    $("audioCross").classList.toggle("hidden", mode !== "mute");
    $("audioTxt").textContent = mode === "quiet" ? "QUIET" : "";
  }
  function onNack(m) {
    if (m.id === lastSoundId && audio !== "normal") {  // the Uno refuses sounds while muted / quiet
      toast(audio === "mute" ? "Tank is muted - tap 🔊" : "Tank is in quiet mode - tap 🔊");
    } else if (m.reason === "NOT_OWNER" || m.reason === "BUSY") {
      var who = owner === "ir" ? "the IR remote" : (ownerClient || "someone");
      banner("warn", "Busy - " + who + " is driving");
    } else if (m.reason === "BODY_OFFLINE") {
      banner("bad", "Tank body offline");
    } else {
      toast(m.reason + ": " + m.message);
    }
  }

  var bannerKind = "", bannerTimer = 0;
  function banner(kind, text) {
    var b = $("banner");
    bannerKind = kind;
    b.className = "ov banner" + (kind ? " show " + kind : "");
    b.textContent = text;
    clearTimeout(bannerTimer);
    if (kind === "warn") bannerTimer = setTimeout(function () { banner("", ""); }, 3000);
  }
  var toastTimer = 0;
  function toast(text) {
    var t = $("toast");
    t.textContent = text; t.className = "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ""; }, 2500);
  }

  // ---------- WiFi signal (from /info every 10 s) ----------
  function pollWifi() {
    fetch("/info", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      var rssi = d.net && typeof d.net.rssi === "number" ? d.net.rssi : null;
      var bars = rssi === null ? "-" : (rssi > -55 ? "▂▄▆█" : rssi > -65 ? "▂▄▆" : rssi > -75 ? "▂▄" : "▂");
      $("wifiChip").textContent = bars;
      $("wifiChip").className = rssi !== null && rssi <= -75 ? "warn" : "";
    }).catch(function () { $("wifiChip").textContent = "-"; });
  }

  // ---------- joysticks (pointer events: touch + mouse) ----------
  function shape(v) {  // deadzone + expo, keeps the sign
    var a = Math.abs(v);
    if (a < DEADZONE) return 0;
    a = (a - DEADZONE) / (1 - DEADZONE);
    a = (1 - EXPO) * a + EXPO * a * a * a;
    return v < 0 ? -a : a;
  }
  function Stick(el, onMove, onRelease) {
    var knob = el.querySelector(".knob"), id = null, self = this;
    this.x = 0; this.y = 0; this.held = false;
    function update(ev) {
      var r = el.getBoundingClientRect(), rad = r.width / 2;
      var dx = (ev.clientX - r.left - rad) / rad, dy = (ev.clientY - r.top - rad) / rad;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > 1) { dx /= len; dy /= len; }
      self.x = dx; self.y = -dy;
      knob.style.transform = "translate(" + (dx * rad * 0.7) + "px," + (dy * rad * 0.7) + "px)";
      onMove();
    }
    this.release = function (notify) {
      if (!self.held) return;
      self.held = false; id = null; self.x = 0; self.y = 0;
      knob.style.transform = "";
      el.classList.remove("held");
      if (notify) onRelease();
    };
    el.addEventListener("pointerdown", function (ev) {
      if (!wsOpen || el.classList.contains("off") || el.classList.contains("ind") || id !== null) return;
      id = ev.pointerId;
      el.setPointerCapture(id);
      self.held = true;
      el.classList.add("held");
      update(ev);
      ev.preventDefault();
    });
    el.addEventListener("pointermove", function (ev) { if (ev.pointerId === id) update(ev); });
    ["pointerup", "pointercancel", "lostpointercapture"].forEach(function (t) {
      el.addEventListener(t, function (ev) { if (ev.pointerId === id) self.release(true); });
    });
  }

  var driveTimer = 0, camTimer = 0, tiltOn = false, tilt = { v: 0, w: 0 };
  function driveValues() {
    var k = speed / 100;
    if (tiltOn) return { v: Math.round(tilt.v * 100 * k), w: Math.round(tilt.w * 100 * k) };
    // stick x right +, y up + -> v = y, w = -x (w > 0 turns left)
    return { v: Math.round(shape(drive.y) * 100 * k), w: Math.round(-shape(drive.x) * 100 * k) };
  }
  function sendDrive() {
    // Review I2: never queue drives behind a slow link (they would arrive late, in a burst).
    // Skipping one is safe - the tank's deadman stops it if drives stop arriving.
    if (ws && ws.bufferedAmount > 0) return;
    var d = driveValues();
    send({ t: "drive", v: d.v, w: d.w });
  }
  function startDriveTimer() {
    if (driveTimer) return;
    sendDrive();
    driveTimer = setInterval(sendDrive, DRIVE_MS);  // keeps streaming even when the stick is still
  }
  function stopDrive() {
    clearInterval(driveTimer); driveTimer = 0;
    send({ t: "stop", id: nextId++ });
  }
  var drive = new Stick($("drivePad"), startDriveTimer, stopDrive);

  function sendCam() {
    if (ws && ws.bufferedAmount > 0) return;  // same rule as drive (review I2)
    send({ t: "cam_joy", x: Math.round(cam.x * 100), y: Math.round(cam.y * 100), active: true });
  }
  var cam = new Stick($("camPad"), function () {
    if (!camTimer) { sendCam(); camTimer = setInterval(sendCam, DRIVE_MS); }
  }, function () {
    clearInterval(camTimer); camTimer = 0;
    send({ t: "cam_joy", x: 0, y: 0, active: false });  // the Uno glides home after its delay unless locked
  });

  function releaseAll(notify) {
    drive.release(notify); cam.release(notify);
    if (!notify) { clearInterval(driveTimer); driveTimer = 0; clearInterval(camTimer); camTimer = 0; }
  }
  function setPads() {
    var off = !wsOpen;
    $("drivePad").classList.toggle("off", off);
    $("camPad").classList.toggle("off", off);
  }

  // ---------- buttons ----------
  $("stop").addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    releaseAll(false);
    send({ t: "stop", id: nextId++ });
    if (navigator.vibrate) navigator.vibrate(60);
  });
  $("audioChip").addEventListener("click", function () {
    audioAsk = { id: nextId, mode: audio === "normal" ? "mute" : "normal" };
    send({ t: "audio_mode", mode: audioAsk.mode, id: nextId++ });
  });
  $("camHome").addEventListener("click", function () { send({ t: "cam_home", id: nextId++ }); });
  $("camLock").addEventListener("click", function () {
    camLocked = !camLocked;
    $("camLock").classList.toggle("on", camLocked);
    send({ t: "cam_lock", on: camLocked, id: nextId++ });
    toast(camLocked ? "Camera stays where you leave it" : "Camera returns home on release");
  });
  $("snap").href = "http://" + location.hostname + ":81/capture";
  $("speed").addEventListener("input", function (ev) {
    speed = Number(ev.target.value);
    $("speedTxt").textContent = speed + "%";
    $("maxTxt").textContent = speed + "%";
    try { localStorage.setItem("cq_speed", String(speed)); } catch (e) { /* private mode */ }
  });
  var sheets = { soundsBtn: "soundSheet", movesBtn: "movesSheet", moreBtn: "moreSheet" };
  Object.keys(sheets).forEach(function (b) {
    $(b).addEventListener("click", function () {
      var open = $(sheets[b]).classList.contains("show");
      Object.keys(sheets).forEach(function (k) { $(sheets[k]).classList.remove("show"); });
      if (!open) $(sheets[b]).classList.add("show");
    });
  });
  SOUNDS.forEach(function (name) {
    var b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.textContent = name.replace(/_/g, " ");
    b.addEventListener("click", function () { lastSoundId = nextId; send({ t: "sound", name: name, id: nextId++ }); });
    $("soundGrid").appendChild(b);
  });

  // ---------- phone-tilt steering (only if the browser really delivers the sensor) ----------
  function onOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    $("tiltBtn").classList.remove("hidden");
    // phone held in landscape-ish, tilt forward = drive forward; side tilt = turn
    var fwd = Math.max(-1, Math.min(1, -(e.beta - 45) / 30));
    var side = Math.max(-1, Math.min(1, e.gamma / 30));
    tilt.v = shape(fwd); tilt.w = -shape(side);
  }
  if (window.DeviceOrientationEvent) {
    var needsPermission = typeof DeviceOrientationEvent.requestPermission === "function";
    if (!needsPermission) window.addEventListener("deviceorientation", onOrientation);
    else if (window.isSecureContext) $("tiltBtn").classList.remove("hidden");  // iOS: ask on tap
  }
  $("tiltBtn").addEventListener("click", function () {
    function toggle() {
      tiltOn = !tiltOn;
      $("tiltState").textContent = tiltOn ? "[ ON ]" : "[ OFF ]";
      $("tiltBtn").classList.toggle("on", tiltOn);
      toast(tiltOn ? "Tilt steering: hold the pad to drive" : "Joystick steering");
    }
    if (!tiltOn && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().then(function (s) {
        if (s === "granted") { window.addEventListener("deviceorientation", onOrientation); toggle(); }
      });
    } else {
      toggle();
    }
  });

  // ---------- safety: hidden page / closing = stop ----------
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { releaseAll(false); send({ t: "stop", id: nextId++ }); }
  });
  window.addEventListener("pagehide", function () { releaseAll(false); send({ t: "stop" }); });
  window.addEventListener("blur", function () { if (drive.held) drive.release(true); });

  // ---------- camera (MJPEG on port 81, max 2 viewers) ----------
  function startVideo() {
    var img = $("video");
    $("noVideo").classList.add("hidden");  // MJPEG streams do not reliably fire onload
    img.style.visibility = "visible";
    img.onerror = function () {
      img.style.visibility = "hidden";  // no broken-image icon
      $("noVideo").classList.remove("hidden");
      setTimeout(startVideo, 3000);
    };
    img.src = "http://" + location.hostname + ":81/stream?t=" + Date.now();
  }

  connect();
  startVideo();
  drawTape(0);
  showVitals();
  pollWifi();
  setInterval(pollWifi, 10000);
})();
</script>
</body>
</html>
