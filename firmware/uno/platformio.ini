[platformio]
default_envs = mega

[env]
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Isrc
  -DSHIELD_SMARTCAR_V11_TB6612

; Body board (design-notes §29, LLD §11): Mega 2560 = Full profile.
[env:mega]
platform = atmelavr@^5
board = megaatmega2560
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.2
extra_scripts = pre:scripts/git_commit.py
build_flags = ${env.build_flags} -DBOARD_MEGA -Os -flto -fno-exceptions -fno-rtti
build_src_filter = +<*> -<lite/> -<domain/lite/>  ; the Lite app is Uno-only (LLD uno-lite)
build_src_flags = -Wall -Wextra -Werror
upload_speed = 115200
monitor_speed = 250000

; Uno = Lite profile (spec 02 Part D, docs/lld/uno-lite-lld.md). Only lite/ + integer domain modules.
[env:uno]
platform = atmelavr@^5
board = uno
framework = arduino
lib_deps = arduino-libraries/Servo@^1.2.2
extra_scripts = pre:scripts/git_commit.py
build_flags = ${env.build_flags} -DBOARD_UNO -DPROFILE_LITE -Os -flto -mcall-prologues -fno-exceptions -fno-rtti
build_src_filter =
  +<main.cpp> +<lite/> +<drivers/> +<domain/lite/> +<domain/comms/>
  +<domain/input/nec_decoder.cpp> +<domain/input/ir_controller.cpp> +<domain/input/boot_button.cpp>
  +<domain/safety/safety_supervisor.cpp> +<domain/safety/envelope.cpp> +<domain/arbitration/>
  +<domain/estimation/battery_monitor.cpp> +<domain/estimation/ultrasonic_filter.cpp>
  +<domain/settings/eeprom_writer.cpp> +<domain/ui/led_sequencer.cpp> +<domain/util/scheduler.cpp>
  +<domain/ui/annunciator.cpp> +<domain/ui/sound_sequencer.cpp> +<domain/ui/catalogues.cpp>
  +<domain/estimation/encoder_health.cpp>
build_src_flags = -Wall -Wextra -Werror
upload_speed = 115200
monitor_speed = 250000

[env:native]
platform = native@^1
build_src_filter = +<domain/> +<types/>
test_build_src = yes
build_flags = ${env.build_flags} -DCQ_HOST_TEST -lm
build_src_flags = -Wall -Wextra -Werror
