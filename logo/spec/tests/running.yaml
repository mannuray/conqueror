# Tank Logo run tests (Plan N2, design-notes §100): what a program asks the tank to do, in order, and how it ends.
# Every runner (the ESP32 one in v1; the AI engine's later) must pass these. Format: README.md "Run tests".

- name: a square
  source: REPEAT 4 [ FD 50 RT 90 ]
  does: [FORWARD 50, RIGHT 90, FORWARD 50, RIGHT 90, FORWARD 50, RIGHT 90, FORWARD 50, RIGHT 90]
  ends: finished

- name: your own word with an input
  source: |
    TO SQUARE :size
      REPEAT 4 [ FORWARD :size  RIGHT 90 ]
    END
    SQUARE 30
  does: [FORWARD 30, RIGHT 90, FORWARD 30, RIGHT 90, FORWARD 30, RIGHT 90, FORWARD 30, RIGHT 90]
  ends: finished

- name: REPCOUNT and arithmetic in inputs
  source: REPEAT 3 [ FD REPCOUNT * 10 RT 360 / 4 ]  FD 10 - 5  FD (2 + 3) * 4
  does: [FORWARD 10, RIGHT 90, FORWARD 20, RIGHT 90, FORWARD 30, RIGHT 90, FORWARD 5, FORWARD 20]
  ends: finished

- name: a fraction of a REPEAT counts whole rounds
  source: REPEAT 2.5 [ BEEP ]
  does: [BEEP, BEEP]
  ends: finished

- name: IFELSE with a sensor
  source: IFELSE DISTANCE < 30 [ BK 10 LT 90 ] [ FD 20 ]
  world: {distance: 20}
  does: [BACK 10, LEFT 90]
  ends: finished

- name: WHILE stops before it starts
  source: WHILE NOT OBSTACLE? [ FD 10 ]  BEEP
  world: {distance: 10}
  does: [BEEP]
  ends: finished

- name: words are compared without regard to case
  source: IF "cat = "CAT [ BEEP ]
  does: [BEEP]
  ends: finished

- name: a word that gives back a value
  source: |
    TO DOUBLE :x  OUTPUT :x * 2  END
    FD DOUBLE 25
  does: [FORWARD 50]
  ends: finished

- name: tail calls - a countdown of 500 in one frame
  source: TO COUNTDOWN :n IFELSE :n = 0 [ BEEP ] [ COUNTDOWN :n - 1 ] END COUNTDOWN 500
  does: [BEEP]
  ends: finished

- name: tail calls - two words calling each other
  source: |
    TO PING :n  IF :n > 0 [ PONG :n - 1 ]  END
    TO PONG :n  IF :n > 0 [ PING :n - 1 ]  END
    PING 300  BEEP
  does: [BEEP]
  ends: finished

- name: too many words inside each other
  source: |
    TO D :n  OUTPUT 1 + D :n + 1  END
    FD D 0
  does: []
  ends: {error: 7011, line: 1}

- name: STOP ends the program, as done (the STOP key is 7040; Tank Logo LLD §25.6)
  source: REPEAT 10 [ FD 10  IF REPCOUNT = 3 [ STOP ] ]
  does: [FORWARD 10, FORWARD 10, FORWARD 10]
  ends: finished

- name: an obstacle ends a program without BLOCKED?
  source: |
    FD 100
    FD 20
  world: {cut_short: [1]}
  does: [FORWARD 100]
  ends: {error: 7024, line: 1}
  message_has: "in the way on line 1"

- name: a program with BLOCKED? carries on
  source: |
    FD 100
    IF BLOCKED? [ BK 10  RT 90 ]
    FD 20
    IF BLOCKED? [ BEEP ]
  world: {cut_short: [1]}
  does: [FORWARD 100, BACK 10, RIGHT 90, FORWARD 20]
  ends: finished

- name: a stuck track ends the program
  source: FD 50 FD 50
  world: {stuck: [2]}
  does: [FORWARD 50, FORWARD 50]
  ends: {error: 7044, line: 1}

- name: divide by zero has its line
  source: |
    FD 10
    FD 5 / 0
  does: [FORWARD 10]
  ends: {error: 7013, line: 2}

- name: a number that grows too big
  source: FD 1000000 * 2
  does: []
  ends: {error: 7033, line: 1}

- name: a word where a number is needed
  source: SAY "cat + 1
  does: []
  ends: {error: 7012, line: 1}
  message_has: "+ needs a number, but got cat"

- name: a range known only while running
  source: |
    TO F :n  FD :n  END
    F 600
  does: []
  ends: {error: 7025, line: 1}
  message_has: "from 1 to 500 cm"

- name: an arc too tight while running
  source: |
    TO A :r  ARC LEFT 90 :r  END
    A 20
  does: []
  ends: {error: 7022, line: 1}

- name: a word that should give back a value but does not
  source: |
    TO SIDE  IF 1 > 2 [ OUTPUT 5 ]  END
    FD SIDE
  does: []
  ends: {error: 7031, line: 1}

- name: light, sound, camera, tune and speech
  source: LED GREEN  LED [ 255 128 0 ]  SOUND HORN  LOOK UP  LOOK [ 30 -10 ]  PLAY [ C4 E4 2 R ]  SAY [ well done ]
  does: [LED 0 255 0, LED 255 128 0, SOUND HORN, LOOK 0 30, LOOK 30 -10, PLAY 262/250 330/500 0/250, SAY well done]
  ends: finished

- name: speed, wait, arc and pivot
  source: SPEED 60  WAIT 1.5  ARC RIGHT 90 50  PIVOT LEFT 45
  does: [SPEED 60, WAIT 1.5, ARC RIGHT 90 50, PIVOT LEFT 45]
  ends: finished

- name: HEADING and HOME
  source: RT 45  LT 15  FD HEADING  HOME
  does: [RIGHT 45, LEFT 15, FORWARD 30, HOME]
  ends: finished

- name: WAIT UNTIL that is already true
  source: WAIT UNTIL DISTANCE < 20  BEEP
  world: {distance: 10}
  does: [WAIT-UNTIL, BEEP]
  ends: finished

- name: WAIT UNTIL gives up after 60 s and the program goes on
  source: WAIT UNTIL DISTANCE < 5  BEEP
  does: [WAIT-UNTIL, BEEP]
  ends: finished

- name: the time limit
  source: FOREVER [ WAIT 60 ]
  does: [WAIT 60, WAIT 60, WAIT 60, WAIT 60, WAIT 60]
  ends: {error: 7041, line: 1}

# ---- GO and HOLD (Spec 5 Revision 3, Tank Logo LLD §22): GO drives on and the program goes on at once. In the
# world a GO counts as a motion: cut_short / stuck end it at once, otherwise it drives until HOLD or another motion.
- name: GO, then HOLD
  source: GO WAIT 1 HOLD
  does: [GO, WAIT 1, HOLD]
  ends: finished

- name: a move takes over from GO
  source: GO FD 50
  does: [GO, FORWARD 50]
  ends: finished

- name: GO until blocked, with BLOCKED?
  source: |
    GO WAIT UNTIL BLOCKED?
    BK 10 RT 90
  world: {cut_short: [1]}
  does: [GO, WAIT-UNTIL, BACK 10, RIGHT 90]
  ends: finished

- name: GO blocked without BLOCKED? ends the program
  source: |
    GO
    WAIT 5
  world: {cut_short: [1]}
  does: [GO]
  ends: {error: 7024, line: 1}

- name: GO with a stuck track ends the program
  source: GO WAIT 2
  world: {stuck: [1]}
  does: [GO]
  ends: {error: 7044, line: 1}

- name: SPEED while going, and GO again
  source: GO SPEED 60 GO HOLD
  does: [GO, SPEED 60, GO, HOLD]
  ends: finished

- name: HOLD with nothing going
  source: HOLD BEEP
  does: [HOLD, BEEP]
  ends: finished

- name: the motion after a GO counts as the next motion
  source: GO FD 20 FD 30
  world: {cut_short: [3]}
  does: [GO, FORWARD 20, FORWARD 30]
  ends: {error: 7024, line: 1}

# ---- The AI words (Tank Logo LLD §24.2). The world gains two lists:
#   answers:     the laptop's reply to each SEE? / HOWFAR asked, in order: true / false, cm, or null = no answer in
#                300 ms. When the list is used up, no answer comes (FALSE / -1).
#   skill_ends:  how each FIND / WANDER / EXPLORE / SETXY ends, in order: done, not_found, lost, outside_area,
#                no_way, blocked, unknown_thing, stale - or stop (the STOP key). Nothing left: it never ends.
- name: SEE? answered true
  source: IF SEE? "ball [ BEEP ]
  world: {answers: [true]}
  does: ["SEE? ball", BEEP]
  ends: finished

- name: SEE? answered false
  source: IF SEE? "ball [ BEEP ]
  world: {answers: [false]}
  does: ["SEE? ball"]
  ends: finished

- name: SEE? with no answer in 300 ms is FALSE
  source: IF SEE? "ball [ BEEP ]  BEEP
  world: {answers: [null]}
  does: ["SEE? ball", BEEP]
  ends: finished

- name: HOWFAR gives the distance in cm
  source: SAY HOWFAR "ball
  world: {answers: [120]}
  does: [HOWFAR ball, SAY 120]
  ends: finished

- name: HOWFAR with no answer is -1
  source: SAY HOWFAR "ball
  does: [HOWFAR ball, SAY -1]
  ends: finished

- name: FIND done goes on
  source: FIND "ball  BEEP
  world: {skill_ends: [done]}
  does: [FIND ball, BEEP]
  ends: finished

- name: FIND not found
  source: FIND "ball  BEEP
  world: {skill_ends: [not_found]}
  does: [FIND ball]
  ends: {error: 7050, line: 1}
  message_has: "I couldn't find the ball."

- name: FIND while the helper learns a word
  source: FIND "ball  BEEP
  world: {skill_ends: [learning]}
  does: [FIND ball]
  ends: {error: 7056, line: 1}
  message_has: "learning a new word"

- name: FIND lost sight
  source: FIND "ball  BEEP
  world: {skill_ends: [lost]}
  does: [FIND ball]
  ends: {error: 7051, line: 1}
  message_has: "I lost sight of the ball."

- name: FIND outside the play area
  source: AREA 2  FIND "ball  BEEP
  world: {skill_ends: [outside_area]}
  does: [AREA 2, FIND ball AREA 2 AT 0 0]
  ends: {error: 7054, line: 1}
  message_has: "outside the play area"

- name: SETXY with no way
  source: SETXY 0 0  BEEP
  world: {skill_ends: [no_way]}
  does: [SETXY 0 0]
  ends: {error: 7055, line: 1}
  message_has: "can't find a way there"

- name: FIND of a thing the helper does not know
  source: FIND "dragon
  world: {skill_ends: [unknown_thing]}
  does: [FIND dragon]
  ends: {error: 7053, line: 1}
  message_has: "I don't know what a dragon is."

- name: the helper stopped answering
  source: FIND "ball  BEEP
  world: {skill_ends: [stale]}
  does: [FIND ball]
  ends: {error: 7052, line: 1}
  message_has: "stopped answering"

- name: a skill blocked ends the program without BLOCKED?
  source: |
    FIND "ball
    BEEP
  world: {skill_ends: [blocked]}
  does: [FIND ball]
  ends: {error: 7024, line: 1}

- name: a skill blocked in a program with BLOCKED? goes on
  source: |
    FIND "ball
    IF BLOCKED? [ BEEP ]
  world: {skill_ends: [blocked]}
  does: [FIND ball, BEEP]
  ends: finished

- name: STOP during a skill
  source: FIND "ball  BEEP
  world: {skill_ends: [stop]}
  does: [FIND ball]
  ends: {error: 7040, line: 1}

- name: WANDER, EXPLORE and SETXY, one after the other
  source: WANDER 10  EXPLORE  SETXY 20 -30  BEEP
  world: {skill_ends: [done, done, done]}
  does: [WANDER 10, EXPLORE, SETXY 20 -30, BEEP]
  ends: finished

- name: a skill takes over from GO
  source: GO  WANDER 5  BEEP
  world: {skill_ends: [done]}
  does: [GO, WANDER 5, BEEP]
  ends: finished

- name: WAIT UNTIL SEE? asks each tick, then HOLD, then the skill
  source: GO  WAIT UNTIL SEE? "ball  HOLD  FIND "ball
  world: {answers: [false, false, true], skill_ends: [done]}
  does: [GO, WAIT-UNTIL, "SEE? ball", "SEE? ball", "SEE? ball", HOLD, FIND ball]
  ends: finished

- name: AREA is kept where it was set, whatever the tank does next
  source: AREA 2  RIGHT 90  FORWARD 30  WANDER 10
  world: {skill_ends: [done]}
  does: [AREA 2, RIGHT 90, FORWARD 30, WANDER 10 AREA 2 AT 0 0]
  ends: finished

- name: AREA set after a move is anchored there
  source: FORWARD 30  AREA 2  EXPLORE
  world: {skill_ends: [done]}
  does: [FORWARD 30, AREA 2, EXPLORE AREA 2 AT 0 30]
  ends: finished

- name: AREA 0 clears it
  source: AREA 2  AREA 0  WANDER 5
  world: {skill_ends: [done]}
  does: [AREA 2, AREA 0, WANDER 5]
  ends: finished

- name: a skill's number is checked while running
  source: |
    TO W :n  WANDER :n  END
    W 700
  does: []
  ends: {error: 7025, line: 1}

- name: a thing worked out while running must be a word
  source: |
    TO F :t  FIND :t  END
    F 5
  does: []
  ends: {error: 7012, line: 1}
  message_has: "FIND needs a thing"

# ---- Lesson 4, hot and cold (Tank Logo LLD §25.4): the lesson's code without its comment lines.
- name: lesson 4 - hot and cold beeps, then finds you
  source: |
    TO HOTCOLD :cm
      IFELSE :cm < 0 [ WAIT 0.5 ] [
        IFELSE :cm < 40 [ PLAY [ C4 E4 G4 C5 2 ] SAY [ you found me ] STOP ] [ BEEP WAIT :cm / 100 ]
      ]
    END
    FOREVER [ HOTCOLD HOWFAR "ball ]
  world: {answers: [120, 30]}
  does: [HOWFAR ball, BEEP, WAIT 1.2, HOWFAR ball, PLAY 262/250 330/250 392/250 523/500, SAY you found me]
  ends: finished

- name: lesson 4 - a ball not seen only waits
  source: |
    TO HOTCOLD :cm
      IFELSE :cm < 0 [ WAIT 0.5 ] [
        IFELSE :cm < 40 [ PLAY [ C4 E4 G4 C5 2 ] SAY [ you found me ] STOP ] [ BEEP WAIT :cm / 100 ]
      ]
    END
    FOREVER [ HOTCOLD HOWFAR "ball ]
  world: {answers: [null, null, 30]}
  does: [HOWFAR ball, WAIT 0.5, HOWFAR ball, WAIT 0.5, HOWFAR ball, PLAY 262/250 330/250 392/250 523/500, SAY you found me]
  ends: finished
