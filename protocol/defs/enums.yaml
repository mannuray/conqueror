- name: Source
  doc: "Who sent a network motion command (ESP32 already arbitrated human vs AI). AUTO = the bridge's closed-loop motion service (TURN / DRIVE_RATE for a body without them): its w is a physical turn, never flipped by car-style reverse steering (spec 02 Part E, design-notes §39)."
  values: { NONE: 0, HUMAN: 1, AI: 2, AUTO: 3 }
- name: Owner
  doc: Motion owner as seen by the Uno.
  values: { NONE: 0, NETWORK: 1, IR: 2, CALIBRATION: 3 }
- name: OwnerHintValue
  doc: Network owner sent to the Uno for the LED colour.
  values: { NONE: 0, HUMAN: 1, AI: 2 }
- name: TurnMode
  doc: TURN.mode bits 0-6; bit 7 = pivot.
  values: { BY: 0, TO: 1 }
- name: LedMode
  values: { "OFF": 0, SOLID: 1, BLINK: 2, PULSE: 3 }  # quoted: YAML 1.1 reads bare OFF as false
- name: AudioModeValue
  values: { NORMAL: 0, QUIET: 1, MUTE: 2 }
- name: CalOp
  values: { START: 0, CANCEL: 1 }
- name: CalScript
  values:
    { STILL_SAMPLE: 0, PWM_RAMP: 1, FULL_SPIN: 2, SPIN_AND_ARC: 3, RATE_STEPS: 4,
      RELAY_OSCILLATION: 5, DRIVE_COUNTS: 6, SERVO_NUDGE: 7, IDLE: 8, SELF_TEST: 9 }
  # SELF_TEST (9): re-run the boot self-test (no motion, no CAL_RESULT; result = EVENT SELFTEST).
  # The only way besides a reboot to lift a critical self-test motion lock (owner decision 2026-10-12).
- name: ProfileOp
  values: { SELECT: 0, CREATE: 1, DELETE: 2 }
- name: PrimitiveKind
  values: { NONE: 0, TELEOP: 1, TURN: 2, MOVE: 3 }
- name: ResetReason
  values: { UNKNOWN: 0, POWER_ON: 1, EXTERNAL: 2, BROWN_OUT: 3, WATCHDOG: 4 }
- name: SoundId
  doc: Sounds a client may trigger with SOUND.
  values:
    { STARTUP: 1, READY: 2, SELFTEST_FAIL: 3, CHIRP_UP: 4, CHIRP_DOWN: 5, BLIP: 6, TICK: 7,
      JINGLE: 8, THINKING: 9, OUCH: 10, ERROR: 11,
      SUCCESS: 12, FANFARE: 13, SAD: 14, SAFETY_CHIRP: 15, ACK_BLIP: 16, FAIL: 17, CONFIRM: 18,
      QUESTION: 19, OK_CHIRP: 20, GRUMBLE: 21, SCAN: 22, GOODBYE: 23, HORN: 24 }
  # STARTUP (1) plays the old rising boot sweep (old melody 1); 12-23 are old melodies 2-13; 24 HORN is new (design-notes §75)
  # (docs/legacy/uno-old-led-buzzer.md); SAFETY_CHIRP = old melody 5.
- name: FastFlagBit
  doc: Bit positions in TELEM_FAST.flags.
  values:
    { BLOCKED: 0, LIFTED: 1, TILTED: 2, STALL_L: 3, STALL_R: 4, CAM_MOVING: 5, TURN_LIMITED: 6,
      CAPPED: 7, SOFT_STOP: 8, HALTED: 9, LOCKED: 10, IMU_FAULT: 11, US_FAULT: 12,
      ENCODER_FAULT: 13, CALIBRATING: 14, SYNCED: 15 }
- name: SlowFlagBit
  doc: Bit positions in TELEM_SLOW.flags2.
  values:
    { BATT_LOW: 0, BATT_CRITICAL: 1, LINK_LOST: 2, BRAKE_OFF: 3, MUTED: 4, QUIET: 5,
      ENVELOPE: 6, DEADMAN: 7, SAFETY_OVERRIDE: 8, SELFTEST_LOCKED: 9 }
- name: HwBit
  doc: Bit positions in TELEM_SLOW.hw.
  values: { ENCODERS_ENABLED: 0, IMU_OK: 1, US_OK: 2 }
- name: CapBit
  doc: Bit positions in HELLO.caps - features this body firmware has (the Lite Uno firmware sets only ENCODERS when on).
  values: { ENCODERS: 0, TURN: 1, MOVE: 2, DRIVE_RATE: 3, CALIBRATE: 4, OVERRIDE: 5, AUDIO_LED: 6, SETTINGS_FULL: 7 }
- name: EnvelopeFlagBit
  doc: >-
    Bit positions in ENVELOPE.lock_brake / TELEM_SLOW.env_lock_brake / EVENT ENVELOPE_CHANGED b.
    CHILD_PLAY implies LOCK_BRAKE; only CHILD_PLAY blocks Safety Override (owner decision 2026-10-12).
  values: { LOCK_BRAKE: 0, CHILD_PLAY: 1 }
- name: OverrideReason
  doc: EVENT SAFETY_OVERRIDE b - why Safety Override was entered or exited.
  values:
    { NETWORK: 0, IR: 1, IDLE: 2, MAX_TIME: 3, STOP: 4, OWNER_CHANGE: 5, LINK_LOST: 6,
      ENVELOPE: 7 }
